<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GYM">
  <title>GYM</title>
  <link rel="manifest" href="/cal/gym-manifest.json">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <link rel="apple-touch-icon" href="/cal/gym-icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#09090f; --s1:#111119; --s2:#181826; --s3:#1f1f30;
      --b:#252538; --acc:#e8ff47; --acc2:rgba(232,255,71,.1);
      --txt:#e8e8f0; --mut:#6868a0; --red:#ff6b47; --r:8px;
    }
    html,body { height:100%; background:var(--bg); color:var(--txt);
      font-family:'DM Sans',sans-serif; overflow:hidden;
      -webkit-tap-highlight-color:transparent; user-select:none; }

    /* ── SCREENS ─────────────────────────────── */
    .screen { position:fixed; inset:0; display:flex; flex-direction:column;
      background:var(--bg); transform:translateX(100%);
      transition:transform .28s cubic-bezier(.4,0,.2,1); }
    .screen.active { transform:translateX(0); }
    .screen.behind { transform:translateX(-28%); }

    /* ── HEADER ──────────────────────────────── */
    .hdr { display:flex; align-items:center; gap:10px; padding:14px 14px;
      padding-top:max(14px,env(safe-area-inset-top));
      border-bottom:1px solid var(--b); flex-shrink:0; }
    .hdr-logo { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:.05em; color:var(--acc); }
    .hdr-title { flex:1; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      outline:none; min-width:0; }
    .hdr-title[contenteditable="true"] { border-bottom:1.5px solid var(--acc); padding-bottom:1px; }

    /* ── ICON BUTTONS ────────────────────────── */
    .ico { width:44px; height:44px; border:none; background:none;
      display:flex; align-items:center; justify-content:center;
      border-radius:6px; cursor:pointer; color:var(--mut);
      transition:color .12s,background .12s; flex-shrink:0; }
    .ico:active { background:var(--s2); color:var(--txt); }
    .ico.red:active { color:var(--red); }
    .ico.acc { color:var(--acc); }

    /* ── SCROLL ──────────────────────────────── */
    .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:max(32px,env(safe-area-inset-bottom)); }

    /* ── HOME BUTTONS ────────────────────────── */
    .home-btns { padding:12px 12px 6px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn-start { height:88px; border-radius:var(--r); border:none; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:opacity .15s; }
    .btn-start:active { opacity:.75; }
    .btn-start .bs-ico { flex-shrink:0; }
    .btn-start .bs-lbl { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1.5px; text-align:center; line-height:1.25; }
    .btn-start.accent { background:var(--acc); color:#000; }
    .btn-start.outline { background:var(--s2); border:1px solid var(--border2,var(--b)); color:var(--txt); }


    /* ── SESSION CARDS ───────────────────────── */
    .list-label { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:2.5px;
      text-transform:uppercase; color:var(--mut); padding:10px 18px 8px; }
    .card { margin:0 12px 8px; background:var(--s1); border:1px solid var(--b);
      border-radius:var(--r); overflow:hidden; }
    .card-main { padding:13px 14px; cursor:pointer;
      display:flex; align-items:center; gap:12px; }
    .card-main:active { background:var(--s2); }
    .card-info { flex:1; min-width:0; }
    .card-date { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:2px;
      text-transform:uppercase; color:var(--acc); margin-bottom:3px; }
    .card-name { font-family:'Bebas Neue',sans-serif; font-size:21px; font-weight:400;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.04em; }
    .card-meta { font-size:13px; color:var(--mut); margin-top:2px; }
    .card-repeat { border-top:1px solid var(--b); padding:9px 14px; cursor:pointer;
      display:flex; align-items:center; justify-content:space-between; }
    .card-repeat:active { background:var(--s2); }
    .card-repeat span { font-size:13px; font-weight:700; letter-spacing:.5px;
      text-transform:uppercase; color:var(--mut); }


    /* ── HOY ──────────────────────────────────── */
    .today-card { margin:12px 12px 4px; background:var(--s2); border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .today-hdr { padding:10px 14px 4px; }
    .today-lbl { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--acc); margin-bottom:2px; }
    .today-dayname { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.04em; line-height:1; }
    .today-sesname { font-family:'DM Sans',sans-serif; font-size:12px; color:var(--mut); padding:2px 14px 6px; }
    .today-btn { width:calc(100% - 24px); margin:4px 12px 12px; height:46px; background:var(--acc); color:#000; border:none; border-radius:var(--r); font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1.5px; cursor:pointer; }
    .today-rest { padding:12px 14px; display:flex; align-items:center; gap:10px; }
    .today-rest-icon { font-size:22px; }
    .today-rest-day { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.04em; color:var(--mut); }
    .today-rest-sub { font-family:'DM Sans',sans-serif; font-size:11px; color:var(--mut); margin-top:1px; }
    /* ── CICLO FILTER ─────────────────────────── */
    .ciclo-filter { display:flex; align-items:center; gap:6px; padding:12px 14px 2px; }
    .ciclo-filter-lbl { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--mut); margin-right:2px; }
    .cf-btn { height:28px; padding:0 14px; border-radius:20px; border:1px solid var(--b); background:none; color:var(--mut); font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.06em; cursor:pointer; transition:all .2s; }
    .cf-btn.active { background:var(--acc); border-color:var(--acc); color:#000; }


    /* ── HOME ACTIONS ──────────────────────────── */
    .home-actions { display:flex; flex-direction:column; gap:10px; padding:20px 12px 8px; }
    .btn-home { width:100%; height:72px; border-radius:var(--r); border:none; cursor:pointer;
      display:flex; align-items:center; gap:16px; padding:0 22px;
      font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; transition:opacity .15s; }
    .btn-home:active { opacity:.75; }
    .btn-home.primary { background:var(--acc); color:#000; }
    .btn-home.secondary { background:var(--s2); color:var(--txt); border:1px solid var(--b); }
    .btn-home .bh-ico { flex-shrink:0; }
    /* ── CICLO GROUPS ────────────────────────── */
    .ciclo-group { margin:10px 12px 0; border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .ciclo-group-hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer; background:var(--s2); }
    .ciclo-group-hdr:active { background:var(--s3); }
    .ciclo-group-badge { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--acc); margin-bottom:2px; }
    .ciclo-group-name { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.04em; line-height:1; }
    .ciclo-group-body { border-top:1px solid var(--b); }
    .ciclo-day-row { display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--b); cursor:pointer; }
    .ciclo-day-row:last-child { border-bottom:none; }
    .ciclo-day-row:active { background:var(--s2); }
    .cdr-dia { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--acc); min-width:68px; }
    .cdr-name { flex:1; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:.04em; }
    .cg-chev { transition:transform .2s; color:var(--mut); flex-shrink:0; }
    .cg-chev.open { transform:rotate(90deg); }
    /* ── PLANTILLA CARDS (home) ──────────────── */
    .tpl-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 12px 4px; }
    .tpl-card { background:var(--s1); border:1px solid var(--b);
      border-radius:var(--r); overflow:hidden; }
    .tpl-card-use { padding:12px 12px 8px; cursor:pointer; }
    .tpl-card-use:active { background:var(--s2); }
    .tpl-badge { display:inline-block; background:var(--acc2); color:var(--acc);
      font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      padding:2px 7px; border-radius:3px; margin-bottom:6px; }
    .tpl-card-name { font-family:'Bebas Neue',sans-serif; font-size:18px; font-weight:400; line-height:1.2; letter-spacing:.04em; }
    .tpl-card-meta { font-size:12px; color:var(--mut); margin-top:3px; }
    .tpl-card-foot { border-top:1px solid var(--b);
      display:flex; }
    .tpl-card-edit { flex:1; height:36px; border:none; background:none;
      color:var(--mut); cursor:pointer;
      font-family:'DM Sans',sans-serif;
      font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:5px; }
    .tpl-card-edit:active { background:var(--s2); color:var(--txt); }

    /* ── EMPTY STATE ─────────────────────────── */
    .empty { display:flex; flex-direction:column; align-items:center;
      gap:12px; padding:60px 40px; text-align:center; }
    .empty svg { opacity:.18; }
    .empty p { color:var(--mut); font-size:17px; font-weight:600; line-height:1.4; }

    /* ── SESSION EDITOR ──────────────────────── */
    .ex-block { margin:10px 12px 0; background:var(--s1);
      border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .ex-hdr { padding:11px 13px; display:flex; align-items:center; gap:10px;
      border-bottom:1px solid var(--b); }
    .ex-name { flex:1; font-family:'Bebas Neue',sans-serif; font-size:18px; font-weight:400; letter-spacing:.5px;
      text-transform:uppercase; color:var(--txt); background:none; border:none;
      cursor:pointer; text-align:left; padding:0;
      display:flex; align-items:center; gap:6px; }
    .ex-name span { color:var(--acc); font-size:12px; }
    .serie-row { display:flex; align-items:center; gap:7px;
      padding:8px 13px; border-bottom:1px solid var(--b); }
    .serie-n { font-family:'JetBrains Mono',monospace; font-size:12px;
      color:var(--mut); width:18px; flex-shrink:0; text-align:center; }
    .serie-field { display:flex; align-items:stretch; background:var(--s3);
      border:1px solid var(--b); border-radius:5px; overflow:hidden; flex:1; }
    .serie-field label { font-size:10px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--mut);
      padding:0 7px; display:flex; align-items:center;
      border-right:1px solid var(--b); flex-shrink:0; background:var(--s2); }
    .serie-input { font-family:'JetBrains Mono',monospace;
      font-size:21px; font-weight:700; color:var(--txt);
      background:none; border:none; outline:none;
      width:100%; text-align:center; padding:7px 4px;
      -moz-appearance:textfield; }
    .serie-input::-webkit-outer-spin-button,
    .serie-input::-webkit-inner-spin-button { -webkit-appearance:none; }
    .serie-input:focus { background:rgba(200,255,0,.06); }
    .serie-del { width:32px; height:32px; border:none; background:none;
      color:var(--mut); border-radius:5px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .serie-del:active { background:rgba(255,59,48,.15); color:var(--red); }
    .ex-foot { display:flex; border-top:1px solid var(--b); }
    .ex-foot-btn { flex:1; height:44px; border:none; background:none; color:var(--acc);
      cursor:pointer; font-family:'DM Sans',sans-serif;
      font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:5px; }
    .ex-foot-btn:active { background:var(--acc2); }
    .ex-foot-btn+.ex-foot-btn { border-left:1px solid var(--b); }
    .ex-foot-btn.del { color:#555; }
    .ex-foot-btn.del:active { color:var(--red); background:rgba(255,59,48,.08); }
    .btn-add-ex { margin:10px 12px 0; width:calc(100% - 24px); height:50px;
      border:1.5px dashed var(--b); background:none; border-radius:var(--r);
      cursor:pointer; color:var(--acc);
      font-family:'DM Sans',sans-serif;
      font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-add-ex:active { background:var(--acc2); border-style:solid; }

    /* ── PLANTILLA EDITOR (screen) ───────────── */
    .tpl-ex-row { display:flex; align-items:center; gap:10px;
      padding:13px 14px; border-bottom:1px solid var(--b); }
    .tpl-ex-name { font-family:'Bebas Neue',sans-serif; flex:1; font-size:18px; font-weight:400; letter-spacing:.04em; cursor:pointer; }
    .tpl-ex-name:active { color:var(--acc); }
    .tpl-ex-del { width:36px; height:36px; border:none; background:none;
      color:var(--mut); border-radius:5px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .tpl-ex-del:active { background:rgba(255,59,48,.15); color:var(--red); }
    .tpl-ex-num { font-family:'JetBrains Mono',monospace; font-size:12px;
      color:var(--acc); width:22px; flex-shrink:0; text-align:center; }

    /* ── OVERLAYS / SHEETS ───────────────────── */
    .overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.72);
      display:flex; align-items:flex-end;
      opacity:0; pointer-events:none; transition:opacity .2s; }
    .overlay.open { opacity:1; pointer-events:all; }
    .sheet { width:100%; background:var(--s1);
      border-radius:14px 14px 0 0; border-top:1px solid var(--b);
      padding-bottom:max(16px,env(safe-area-inset-bottom));
      max-height:82vh; display:flex; flex-direction:column;
      transform:translateY(16px); transition:transform .22s cubic-bezier(.4,0,.2,1); }
    .overlay.open .sheet { transform:translateY(0); }
    .sheet-hdr { padding:14px 16px; display:flex; align-items:center;
      justify-content:space-between; border-bottom:1px solid var(--b); flex-shrink:0; }
    .sheet-hdr-title { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700;
      letter-spacing:1.8px; text-transform:uppercase; color:var(--mut); }
    .search-wrap { margin:10px 12px; flex-shrink:0;
      display:flex; align-items:center; gap:8px;
      background:var(--s3); border:1px solid var(--b);
      border-radius:var(--r); padding:0 12px; }
    .search-wrap svg { flex-shrink:0; color:var(--mut); }
    .search-wrap input { flex:1; background:none; border:none; outline:none;
      color:var(--txt); caret-color:var(--acc);
      font-family:'DM Sans',sans-serif;
      font-size:16px; padding:11px 0; }
    .search-wrap input::placeholder { color:var(--mut); }
    .picker-items { overflow-y:auto; flex:1; padding:4px 8px 8px; }
    .picker-item { padding:12px 12px; border-radius:6px; cursor:pointer;
      font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500;
      display:flex; align-items:center; gap:10px; }
    .picker-item:active { background:var(--s3); }
    .picker-item.new { color:var(--acc); font-weight:700; }

    /* ── SAVE-AS-TEMPLATE MINI SHEET ─────────── */
    .mini-input-wrap { margin:14px 14px 6px;
      background:var(--s3); border:1px solid var(--b); border-radius:var(--r); }
    .mini-input { width:100%; background:none; border:none; outline:none;
      color:var(--txt); caret-color:var(--acc);
      font-family:'DM Sans',sans-serif;
      font-size:17px; font-weight:700; padding:14px 14px; }
    .mini-input::placeholder { color:var(--mut); }
    .mini-hint { padding:0 16px 10px; font-size:13px; color:var(--mut); }
    .sheet-btn { margin:6px 12px; height:52px; border-radius:var(--r);
      border:none; background:var(--acc); color:#000;
      font-family:'Bebas Neue',sans-serif;
      font-size:20px; font-weight:400; letter-spacing:1.5px; text-transform:uppercase;
      cursor:pointer; width:calc(100% - 24px); }
    .sheet-btn:active { opacity:.82; }

    /* ── CONFIRM / DELETE ────────────────────── */
    .confirm-body { padding:14px 18px; font-size:15px; color:var(--mut); line-height:1.5; }
    .confirm-btns { display:flex; gap:9px; padding:6px 12px 4px; }
    .btn-cancel { flex:1; height:50px; border-radius:var(--r);
      border:1px solid var(--b); background:none; color:var(--txt);
      font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
    .btn-cancel:active { background:var(--s2); }
    .btn-danger { flex:1; height:50px; border-radius:var(--r);
      border:none; background:var(--red); color:#fff;
      font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
    .btn-danger:active { opacity:.82; }

    /* ── SAVE DOT ────────────────────────────── */
    .save-dot { width:6px; height:6px; border-radius:50%;
      background:var(--acc); opacity:0; transition:opacity .3s; flex-shrink:0; }
    .save-dot.on { opacity:1; }

    /* ── TOAST ───────────────────────────────── */
    .toast { position:fixed; z-index:300;
      bottom:max(26px,env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%) translateY(64px);
      background:var(--acc); color:#000;
      font-family:'Bebas Neue',sans-serif;
      font-size:15px; font-weight:400; letter-spacing:2px; text-transform:uppercase;
      padding:9px 22px; border-radius:100px;
      transition:transform .3s cubic-bezier(.34,1.56,.64,1);
      pointer-events:none; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    svg { display:block; }
  </style>
</head>
<body>

<!-- ═══════════════════════════ SCREEN: HOME ═══════════════════════════════ -->
<div id="scr-home" class="screen active">
  <div class="hdr">
    <div class="hdr-logo">GYM</div>
    <div style="flex:1"></div>
    <button class="ico" id="btn-import" title="Importar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <button class="ico" id="btn-export" title="Exportar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="ico" id="btn-drive" onclick="gdHandleTap()" title="Cuenta" style="position:relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span id="gd-dot" style="display:none;position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--acc);border:1.5px solid var(--bg)"></span>
    </button>
  </div>
  <div class="scroll">
    <div class="home-actions">
      <button class="btn-home primary" id="btn-iniciar">
        <svg class="bh-ico" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        INICIAR SESIÓN
      </button>
      <button class="btn-home secondary" id="btn-plantillas">
        <svg class="bh-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        GESTIONAR PLANTILLAS
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════ OVERLAY: SESSION PICKER ═══════════════════════════ -->
<div class="overlay" id="ov-session-picker">
  <div class="sheet" style="max-height:88vh">
    <div class="sheet-hdr">
      <span class="sheet-hdr-title">Iniciar sesión</span>
      <button class="ico" id="sp-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <button class="sheet-btn" id="sp-blank">

<script>
// ─────────────────────────────────────────────────────────────────────────────

const LS = 'gym_manu_v1';

const PREDEFINED = [

let db = loadDB();

const PRESET_TPLS = [
  { id:'pt-b-l', ciclo:'B', dia:'Lunes',     nombre:'B · Lunes — Potencia Superior',     ejercicios:['Push press','Plyo push-ups','KB press 1 brazo','Muscle-up progresión','Remo explosivo KB'] },
  { id:'pt-b-m', ciclo:'B', dia:'Miércoles', nombre:'B · Miércoles — Potencia Inferior', ejercicios:['Box jump','KB swing 2 brazos','Bulgarian split squat explosivo','Pallof press','KB halos'] },
  { id:'pt-b-v', ciclo:'B', dia:'Viernes',   nombre:'B · Viernes — Full Body Explosivo', ejercicios:['Sprints 20m','TRX row / KB row','CMJ','KB thruster','KB swing 1 brazo','Burpee explosivo'] },
  { id:'pt-c-l', ciclo:'C', dia:'Lunes',     nombre:'C · Lunes — Circuito Full Body',    ejercicios:['Goblet squat','KB press bilateral','Remo KB','Push-ups explosivos','Mountain climbers'] },
  { id:'pt-c-m', ciclo:'C', dia:'Miércoles', nombre:'C · Miércoles — Tabata Inferior',   ejercicios:['KB swing 2 brazos','Goblet squat','KB halos','Mountain climbers'] },
  { id:'pt-c-v', ciclo:'C', dia:'Viernes',   nombre:'C · Viernes — HIIT Completo',       ejercicios:['Sprints 200m','KB thruster','Burpee','KB swing 2 brazos','Tabata burpees'] },
  { id:'pt-a-l', ciclo:'A', dia:'Lunes',     nombre:'A · Lunes — Push',                  ejercicios:['Press banca','Press militar','Fondos lastrados','Push-ups explosivos','Face pull'] },
  { id:'pt-a-m', ciclo:'A', dia:'Miércoles', nombre:'A · Miércoles — Pierna + Core',     ejercicios:['Sentadilla','Romanian Deadlift','KB swings','Pallof press','Plancha RKC'] },
  { id:'pt-a-v', ciclo:'A', dia:'Viernes',   nombre:'A · Viernes — Pull + Integración',  ejercicios:['Dominadas lastradas','Remo barra','KB swing 1 brazo','Sprints 40m','Curl bíceps barra'] },
];


let tpl = null;      // plantilla en edición
let tplOrigin = 'home'; // which screen opened tpl editor
let tplIdx = -1;

// picker context: 'session' | 'tpl-edit'
// picker target: null = añadir, number = renombrar exercise[n]
let pickerCtx = 'session';
let pickerFor = null;

function loadDB() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) {
      const p = JSON.parse(raw);
      p.ejercicios_predefinidos = [...new Set([...PREDEFINED, ...(p.ejercicios_predefinidos||[])])];
      p.plantillas = p.plantillas || [];
      return p;
    }
  } catch(e) {}
  const fresh = { version:1, ejercicios_predefinidos:[...PREDEFINED], sesiones:[], plantillas: PRESET_TPLS.map(t=>({...t})) };
  return fresh;
}

function saveDB() { localStorage.setItem(LS, JSON.stringify(db)); }

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function showScreen(id) {
  const all = ['scr-home','scr-session','scr-tpl-edit','scr-templates'];
  all.forEach(sid => {
    const el = document.getElementById(sid);
    el.classList.remove('active','behind');
  });
  // Stack: behind is whatever was active before
  if (id === 'scr-session') {
    document.getElementById('scr-home').classList.add('behind');
    document.getElementById('scr-session').classList.add('active');
  } else if (id === 'scr-tpl-edit') {
    document.getElementById('scr-home').classList.add('behind');
    document.getElementById('scr-tpl-edit').classList.add('active');
  } else if (id === 'scr-templates') {
    document.getElementById('scr-home').classList.add('behind');
    document.getElementById('scr-templates').classList.add('active');
  } else {
    document.getElementById('scr-home').classList.add('active');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// HOME
// ─────────────────────────────────────────────────────────────────────────────
function renderHome() { /* home is static — sessions/templates on demand */ }


// ─────────────────────────────────────────────────────────────────────────────
// CICLO GROUPS (shared renderer, mode: 'pick' | 'manage')
// ─────────────────────────────────────────────────────────────────────────────
function renderCicloGroups(containerId, mode) {
  const el = document.getElementById(containerId);
  if (!db.plantillas.length) {
    el.innerHTML = '<div class="empty" style="padding:40px"><p>Sin plantillas.<br>Crea la primera.</p></div>';
    return;
  }
  const groups = { A:[], B:[], C:[], other:[] };
  db.plantillas.forEach((t,i) => {
    if (t.ciclo && groups[t.ciclo]) groups[t.ciclo].push({t,i});
    else groups.other.push({t,i});
  });
  let html = '';
  ['B','C','A'].forEach(ciclo => {
    if (!groups[ciclo].length) return;
    const isOpen = openCiclos.has(ciclo);
    const rowAction = mode === 'pick'
      ? `onclick="sesFromTpl(IDX);closeOv('ov-session-picker')"`
      : `onclick="openTplEdit(IDX)"`;
    html += `<div class="ciclo-group">
      <div class="ciclo-group-hdr" onclick="toggleCicloGroup('${ciclo}');renderCicloGroups('${containerId}','${mode}')">
        <div>
          <div class="ciclo-group-badge">CICLO ${ciclo}</div>
          <div class="ciclo-group-name">${CICLO_NAMES[ciclo]}</div>
        </div>
        <svg class="cg-chev ${isOpen?'open':''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      ${isOpen ? `<div class="ciclo-group-body">${groups[ciclo].map(({t,i}) => {
        const sesName = t.nombre.includes('—') ? t.nombre.split('—')[1].trim() : t.nombre;
        const action = rowAction.replace(/IDX/g, i);
        return `<div class="ciclo-day-row" ${action}>
          <div class="cdr-dia">${t.dia||''}</div>
          <div class="cdr-name">${esc(sesName)}</div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <button style="background:none;border:none;color:var(--mut);cursor:pointer;padding:4px;border-radius:4px;line-height:1" onclick="event.stopPropagation();openTplEdit(${i})" title="Editar">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>`;
      }).join('')}</div>` : ''}
    </div>`;
  });
  if (groups.other.length) {
    html += `<div class="list-label" style="margin-top:10px">Mis plantillas</div><div class="tpl-grid">`;
    groups.other.forEach(({t,i}) => {
      html += `<div class="tpl-card">
        <div class="tpl-card-use" data-use-tpl="${i}">
          <div class="tpl-badge">PLANTILLA</div>
          <div class="tpl-card-name">${esc(t.nombre)}</div>
          <div class="tpl-card-meta">${t.ejercicios.length} ejercicio${t.ejercicios.length!==1?'s':''}</div>
        </div>
        <div class="tpl-card-foot">
          <button class="tpl-card-edit" data-edit-tpl="${i}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            EDITAR
          </button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html;
  // re-attach delegated click for 'other' tpl cards
  el.querySelectorAll('[data-use-tpl]').forEach(el2 => {
    el2.addEventListener('click', () => {
      const idx = +el2.dataset.useTpl;
      if (mode === 'pick') { closeOv('ov-session-picker'); }
      sesFromTpl(idx);
    });
  });
  el.querySelectorAll('[data-edit-tpl]').forEach(el2 => {
    el2.addEventListener('click', e => { e.stopPropagation(); openTplEdit(+el2.dataset.editTpl); });
  });
}

    if (t.ciclo && groups[t.ciclo]) groups[t.ciclo].push({t,i});
    else groups.other.push({t,i});
  });
  let html = '';
  ['B','C','A'].forEach(ciclo => {
    if (!groups[ciclo].length) return;
    const isOpen = openCiclos.has(ciclo);
    html += `<div class="ciclo-group">
      <div class="ciclo-group-hdr" onclick="toggleCicloGroup('${ciclo}')">

          <div class="ciclo-group-badge">CICLO ${ciclo}</div>

      </div>
      ${isOpen ? `<div class="ciclo-group-body">${groups[ciclo].map(({t,i}) => {

          <div class="cdr-dia">${t.dia||''}</div>
          <div class="cdr-name">${esc(sesName)}</div>

        </div>`;
      }).join('')}</div>` : ''}
    </div>`;
  });
  if (groups.other.length) {
    html += `<div class="list-label" style="margin-top:10px">Mis plantillas</div><div class="tpl-grid">`;
    groups.other.forEach(({t,i}) => {
      html += `<div class="tpl-card">
        <div class="tpl-card-use" data-use-tpl="${i}">

          <div class="tpl-card-meta">${t.ejercicios.length} ejercicio${t.ejercicios.length!==1?'s':''}</div>
        </div>
        <div class="tpl-card-foot">
          <button class="tpl-card-edit" data-edit-tpl="${i}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            EDITAR
          </button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  sec.innerHTML = html;
}

function renderSessions() {
  const el = document.getElementById('sessions-list');

    </div>
    <div>${serHTML}</div>

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>SERIE

      </button>

function addExSes(nombre) {
  ses.ejercicios.push({nombre,series:[]});
  autosave(); renderSession();
  setTimeout(() => document.getElementById('ses-scroll').scrollTo({top:99999,behavior:'smooth'}), 60);
}
function renameExSes(ei, nombre) {
  ses.ejercicios[ei].nombre = nombre; autosave();
  const btn = document.querySelector(`#ex${ei} .ex-name`);
  if (btn) btn.innerHTML = `${esc(nombre)} <span>▾</span>`;
}
function removeExSes(ei) { ses.ejercicios.splice(ei,1); autosave(); renderSession(); }
function addSet(ei) {
  ses.ejercicios[ei].series.push({reps:'',kg:''}); autosave(); renderSession();
  setTimeout(() => {
    const inputs = document.querySelectorAll(`#ex${ei} .serie-input`);
    if (inputs.length) inputs[inputs.length-2].focus();
  }, 60);
}
function dupLastSet(ei) {
  const series = ses.ejercicios[ei].series;
  if (!series.length) { addSet(ei); return; }
  const last = series[series.length-1];
  series.push({reps:last.reps,kg:last.kg}); autosave(); renderSession(); toast('Serie duplicada');
}
function removeSet(ei,si) { ses.ejercicios[ei].series.splice(si,1); autosave(); renderSession(); }

function openPicker(forIdx) {
  pickerFor = forIdx;
  document.getElementById('picker-q').value = '';
  renderPicker('');
  document.getElementById('picker-overlay').classList.add('open');
  setTimeout(() => document.getElementById('picker-q').focus(), 120);
}
function closePicker() {
  closeOverlay('picker-overlay');
  document.getElementById('picker-q').blur();
}
function renderPicker(q) {
  const qn = q.trim().toLowerCase();
  const matches = db.ejercicios_predefinidos
    .filter(n => !qn || n.toLowerCase().includes(qn))
    .sort((a,b) => a.localeCompare(b,'es'));
  let html = '';
  const exact = db.ejercicios_predefinidos.some(n => n.toLowerCase()===qn);
  if (qn && !exact) {
    const cap = q.trim().charAt(0).toUpperCase()+q.trim().slice(1);
    html += `<div class="picker-item new" data-new="${esc(cap)}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Añadir "${esc(cap)}"</div>`;
  }
  matches.forEach(n => { html += `<div class="picker-item" data-pick="${esc(n)}">${esc(n)}</div>`; });
  if (!html) html = `<div style="padding:28px;text-align:center;color:var(--mut);font-size:16px">Sin resultados</div>`;
  document.getElementById('picker-items').innerHTML = html;
}

document.getElementById('picker-close').addEventListener('click', closePicker);
document.getElementById('picker-overlay').addEventListener('click', e => {
  if (e.target===document.getElementById('picker-overlay')) closePicker();
});
document.getElementById('picker-q').addEventListener('input', e => renderPicker(e.target.value));

document.getElementById('picker-items').addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  const newEx = e.target.closest('[data-new]');
  if (pick)  { selectEx(pick.dataset.pick); return; }
  if (newEx) {
    const n = newEx.dataset.new;
    if (!db.ejercicios_predefinidos.includes(n)) { db.ejercicios_predefinidos.push(n); saveDB(); }
    selectEx(n); toast(`"${n}" guardado`);
  }
});

function selectEx(nombre) {
  closePicker();
  if (pickerCtx === 'session') {
    if (pickerFor === null) addExSes(nombre);
    else renameExSes(pickerFor, nombre);
  } else { // tpl-edit
    if (pickerFor === null) { tpl.ejercicios.push(nombre); renderTplEdit(); }
    else { tpl.ejercicios[pickerFor] = nombre; renderTplEdit(); }
  }
}

function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

// btn-new and btn-from-tpl replaced by btn-iniciar and btn-plantillas

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('es-ES',
    {day:'2-digit',month:'short',year:'numeric'}).replace('.','');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

let gdFileId      = localStorage.getItem(LS_FXID) || null;

function gdInitClient() {
  if (typeof google === 'undefined' || !google.accounts) return;
  gdTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GD_CLIENT_ID,
    scope: GD_SCOPE,
    callback: async (resp) => {
      if (resp.error) { toast('Error al conectar Drive'); return; }
      gdToken = resp.access_token;
      const exp = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem(LS_TOKEN, gdToken);
      localStorage.setItem(LS_EXP,   String(exp));
      gdUpdateUI(true);
      await gdEnsureFolder().catch(() => {});
      toast('Drive conectado ✓');
    }
  });
  // Restore token if still valid
  const saved = localStorage.getItem(LS_TOKEN);
  const exp   = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (saved && Date.now() < exp) {
    gdToken = saved;
    gdUpdateUI(true);
  }
}

function gdHandleTap() {
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) {
    if (!gdTokenClient) { toast('Cargando Google…'); return; }
    gdToken = null;
    gdTokenClient.requestAccessToken();
  } else {
    document.getElementById('ov-drive').style.display = 'flex';
  }
}

function gdUpdateUI(on) {
  document.getElementById('gd-dot').style.display = on ? 'block' : 'none';
  document.getElementById('btn-drive').style.opacity = on ? '1' : '0.45';
}

function gdDisconnect() {
  if (gdToken) try { google.accounts.oauth2.revoke(gdToken, () => {}); } catch(e) {}
  gdToken = null; gdFolderId = null; gdFileId = null;
  [LS_TOKEN, LS_EXP, LS_FID, LS_FXID].forEach(k => localStorage.removeItem(k));
  gdUpdateUI(false);
  closeOv('ov-drive');
  toast('Drive desconectado');
}

async function gdFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { Authorization: `Bearer ${gdToken}`, ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    gdToken = null; gdUpdateUI(false);
    toast('Sesión Drive expirada — vuelve a conectar');
    throw new Error('token_expired');
  }
  return res;
}

async function gdEnsureFolder() {
  if (gdFolderId) return gdFolderId;
  const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${GD_FOLDER}%27+and+mimeType%3D%27application%2Fvnd.google-apps.folder%27+and+trashed%3Dfalse&fields=files(id)`);
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    gdFolderId = data.files[0].id;
  } else {
    const cr = await gdFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: GD_FOLDER, mimeType: 'application/vnd.google-apps.folder' })
    });
    const folder = await cr.json();
    gdFolderId   = folder.id;
  }
  localStorage.setItem(LS_FID, gdFolderId);
  return gdFolderId;
}

async function gdEnsureFileId() {
  if (gdFileId) return gdFileId;
  const fid  = await gdEnsureFolder();
  const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${GD_FILE}%27+and+%27${fid}%27+in+parents+and+trashed%3Dfalse&fields=files(id)`);
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    gdFileId = data.files[0].id;
    localStorage.setItem(LS_FXID, gdFileId);
  }
  return gdFileId || null;
}

async function gdSave() {
  closeOv('ov-drive');
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) { toast('Conecta Drive primero'); return; }
  toast('Guardando en Drive…');
  try {
    const folderId = await gdEnsureFolder();
    const fileId   = await gdEnsureFileId();
    const content  = JSON.stringify(db, null, 2);
    const blob     = new Blob([content], { type: 'application/json' });
    const meta     = fileId ? { name: GD_FILE } : { name: GD_FILE, mimeType: 'application/json', parents: [folderId] };
    const form     = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', blob);
    const url    = fileId ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const method = fileId ? 'PATCH' : 'POST';
    const res    = await gdFetch(url, { method, body: form });
    const saved  = await res.json();
    if (!gdFileId && saved.id) { gdFileId = saved.id; localStorage.setItem(LS_FXID, gdFileId); }
    toast('Guardado en Drive ✓');
  } catch(e) { if (e.message !== 'token_expired') toast('Error al guardar'); }
}

async function gdLoad() {
  closeOv('ov-drive');
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) { toast('Conecta Drive primero'); return; }
  toast('Cargando desde Drive…');
  try {
    const fileId = await gdEnsureFileId();
    if (!fileId) { toast('Sin datos en Drive todavía'); return; }
    const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (data.sesiones) {
      db = data;
      db.ejercicios_predefinidos = [...new Set([...PREDEFINED, ...(db.ejercicios_predefinidos || [])])];
      db.plantillas = db.plantillas || [];
      saveDB(); renderHome();
      toast('Cargado desde Drive ✓');
    } else { toast('Archivo no reconocido'); }
  } catch(e) { if (e.message !== 'token_expired') toast('Error al cargar'); }
}

// Init Drive when GIS is ready
;(function waitGIS() {
  if (typeof google !== 'undefined' && google.accounts) { gdInitClient(); }
  else { setTimeout(waitGIS, 400); }
})();
</script>
