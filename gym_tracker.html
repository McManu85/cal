<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080808">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GYM">
  <title>GYM</title>
  <link rel="manifest" href="/cal/gym-manifest.json">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <link rel="apple-touch-icon" href="/cal/gym-icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#09090f; --s1:#111119; --s2:#181826; --s3:#1f1f30;
      --b:#252538; --acc:#e8ff47; --acc2:rgba(232,255,71,.1);
      --txt:#e8e8f0; --mut:#6868a0; --red:#ff6b47; --r:8px;
    }
    html,body { height:100%; background:var(--bg); color:var(--txt);
      font-family:'DM Sans',sans-serif; overflow:hidden;
      -webkit-tap-highlight-color:transparent; user-select:none; }

    /* ── SCREENS ─────────────────────────────── */
    .screen { position:fixed; inset:0; display:flex; flex-direction:column;
      background:var(--bg); transform:translateX(100%); pointer-events:none;
      transition:transform .28s cubic-bezier(.4,0,.2,1); }
    .screen.active { transform:translateX(0); pointer-events:all; }
    .screen.behind { transform:translateX(-28%); pointer-events:none; }

    /* ── HEADER ──────────────────────────────── */
    .hdr { display:flex; align-items:center; gap:10px; padding:14px 14px;
      padding-top:max(14px,env(safe-area-inset-top));
      border-bottom:1px solid var(--b); flex-shrink:0; }
    .hdr-logo { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:.05em; color:var(--acc); }
    .hdr-title { flex:1; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      outline:none; min-width:0; }
    .hdr-title[contenteditable="true"] { border-bottom:1.5px solid var(--acc); padding-bottom:1px; }

    /* ── ICON BUTTONS ────────────────────────── */
    .ico { width:44px; height:44px; border:none; background:none;
      display:flex; align-items:center; justify-content:center;
      border-radius:6px; cursor:pointer; color:var(--mut);
      transition:color .12s,background .12s; flex-shrink:0; }
    .ico:active { background:var(--s2); color:var(--txt); }
    .ico.red:active { color:var(--red); }
    .ico.acc { color:var(--acc); }

    /* ── SCROLL ──────────────────────────────── */
    .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:max(32px,env(safe-area-inset-bottom)); }

    /* ── HOME BUTTONS ────────────────────────── */
    .home-btns { padding:12px 12px 6px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn-start { height:88px; border-radius:var(--r); border:none; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:opacity .15s; }
    .btn-start:active { opacity:.75; }
    .btn-start .bs-ico { flex-shrink:0; }
    .btn-start .bs-lbl { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1.5px; text-align:center; line-height:1.25; }
    .btn-start.accent { background:var(--acc); color:#000; }
    .btn-start.outline { background:var(--s2); border:1px solid var(--border2,var(--b)); color:var(--txt); }


    /* ── SESSION CARDS ───────────────────────── */
    .list-label { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:2.5px;
      text-transform:uppercase; color:var(--mut); padding:10px 18px 8px; }
    .card { margin:0 12px 8px; background:var(--s1); border:1px solid var(--b);
      border-radius:var(--r); overflow:hidden; }
    .card-main { padding:13px 14px; cursor:pointer;
      display:flex; align-items:center; gap:12px; }
    .card-main:active { background:var(--s2); }
    .card-info { flex:1; min-width:0; }
    .card-date { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:2px;
      text-transform:uppercase; color:var(--acc); margin-bottom:3px; }
    .card-name { font-family:'Bebas Neue',sans-serif; font-size:21px; font-weight:400;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.04em; }
    .card-meta { font-size:13px; color:var(--mut); margin-top:2px; }
    .card-repeat { border-top:1px solid var(--b); padding:9px 14px; cursor:pointer;
      display:flex; align-items:center; justify-content:space-between; }
    .card-repeat:active { background:var(--s2); }
    .card-repeat span { font-size:13px; font-weight:700; letter-spacing:.5px;
      text-transform:uppercase; color:var(--mut); }


    /* ── HOY ──────────────────────────────────── */
    .today-card { margin:12px 12px 4px; background:var(--s2); border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .today-hdr { padding:10px 14px 4px; }
    .today-lbl { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--acc); margin-bottom:2px; }
    .today-dayname { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.04em; line-height:1; }
    .today-sesname { font-family:'DM Sans',sans-serif; font-size:12px; color:var(--mut); padding:2px 14px 6px; }
    .today-btn { width:calc(100% - 24px); margin:4px 12px 12px; height:46px; background:var(--acc); color:#000; border:none; border-radius:var(--r); font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1.5px; cursor:pointer; }
    .today-rest { padding:12px 14px; display:flex; align-items:center; gap:10px; }
    .today-rest-icon { font-size:22px; }
    .today-rest-day { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.04em; color:var(--mut); }
    .today-rest-sub { font-family:'DM Sans',sans-serif; font-size:11px; color:var(--mut); margin-top:1px; }
    /* ── CICLO FILTER ─────────────────────────── */
    .ciclo-filter { display:flex; align-items:center; gap:6px; padding:12px 14px 2px; }
    .ciclo-filter-lbl { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--mut); margin-right:2px; }
    .cf-btn { height:28px; padding:0 14px; border-radius:20px; border:1px solid var(--b); background:none; color:var(--mut); font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.06em; cursor:pointer; transition:all .2s; }
    .cf-btn.active { background:var(--acc); border-color:var(--acc); color:#000; }


    /* ── HOME ACTIONS ──────────────────────────── */
    .home-actions { display:flex; flex-direction:column; gap:10px; padding:20px 12px 8px; }
    .btn-home { width:100%; height:72px; border-radius:var(--r); border:none; cursor:pointer;
      display:flex; align-items:center; gap:16px; padding:0 22px;
      font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; transition:opacity .15s; }
    .btn-home:active { opacity:.75; }
    .btn-home.primary { background:var(--acc); color:#000; }
    .btn-home.secondary { background:var(--s2); color:var(--txt); border:1px solid var(--b); }
    .btn-home .bh-ico { flex-shrink:0; }
    /* ── RUTINAS SCREEN ──────────────────────── */
    .rutina-card { margin:10px 12px 0; background:var(--s1); border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .rutina-hdr { display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--b); background:var(--s2); }
    .rutina-name { flex:1; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.04em; color:var(--txt); outline:none; min-width:0; border-bottom:1.5px solid transparent; padding-bottom:1px; }
    .rutina-name:focus { border-bottom-color:var(--acc); }
    .rutina-dia-row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--b); cursor:pointer; }
    .rutina-dia-row:active { background:var(--s2); }
    .rdr-day { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--acc); min-width:62px; }
    .rdr-name { flex:1; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:.04em; }
    .rdr-count { font-family:'DM Sans',sans-serif; font-size:11px; color:var(--mut); white-space:nowrap; }
    .btn-add-dia { width:100%; padding:10px 14px; background:none; border:none; border-top:1px dashed var(--b); color:var(--acc); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
    .btn-add-dia:active { background:var(--acc2); }
    /* ── PICKER RUTINAS ───────────────────────── */
    .pk-rutina { margin:0 12px 8px; border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .pk-rutina-hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; cursor:pointer; background:var(--s2); }
    .pk-rutina-name { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:.04em; }
    .pk-rutina-body { border-top:1px solid var(--b); }
    .pk-dia-row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--b); cursor:pointer; }
    .pk-dia-row:last-child { border-bottom:none; }
    .pk-dia-row:active { background:var(--s2); }
    .pk-dia-day { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--acc); min-width:62px; }
    .pk-dia-name { flex:1; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:.04em; }
    .cg-chev { transition:transform .2s; color:var(--mut); flex-shrink:0; }
    .cg-chev.open { transform:rotate(90deg); }
    /* ── PLANTILLA CARDS (home) ──────────────── */
    .tpl-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 12px 4px; }
    .tpl-card { background:var(--s1); border:1px solid var(--b);
      border-radius:var(--r); overflow:hidden; }
    .tpl-card-use { padding:12px 12px 8px; cursor:pointer; }
    .tpl-card-use:active { background:var(--s2); }
    .tpl-badge { display:inline-block; background:var(--acc2); color:var(--acc);
      font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      padding:2px 7px; border-radius:3px; margin-bottom:6px; }
    .tpl-card-name { font-family:'Bebas Neue',sans-serif; font-size:18px; font-weight:400; line-height:1.2; letter-spacing:.04em; }
    .tpl-card-meta { font-size:12px; color:var(--mut); margin-top:3px; }
    .tpl-card-foot { border-top:1px solid var(--b);
      display:flex; }
    .tpl-card-edit { flex:1; height:36px; border:none; background:none;
      color:var(--mut); cursor:pointer;
      font-family:'DM Sans',sans-serif;
      font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:5px; }
    .tpl-card-edit:active { background:var(--s2); color:var(--txt); }



    /* ── ACTIVITY ─────────────────────────────── */
    .act-pills { display:flex; gap:6px; flex-wrap:wrap; padding:10px 12px; }
    .act-pill { display:flex; flex-direction:column; align-items:center; gap:3px;
      background:var(--s2); border:1px solid var(--b); border-radius:8px;
      padding:8px 10px; cursor:pointer; transition:all .2s; min-width:54px; }
    .act-pill:active { background:var(--acc2); border-color:var(--acc); }
    .act-pill-icon { font-size:18px; line-height:1; }
    .act-pill-lbl { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700;
      letter-spacing:.5px; text-transform:uppercase; color:var(--muted2); white-space:nowrap; }
    .dur-ctrl { display:flex; align-items:center; justify-content:center; gap:16px; padding:8px 0 4px; }
    .dur-btn { width:40px; height:40px; border-radius:50%; border:1.5px solid var(--b);
      background:none; color:var(--txt); font-size:22px; line-height:1; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .dur-btn:active { background:var(--s2); border-color:var(--acc); }
    .dur-val { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:.02em;
      color:var(--acc); line-height:1; min-width:80px; text-align:center; }
    .dur-unit { font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:.15em;
      text-transform:uppercase; color:var(--muted); }
    .int-pills { display:flex; gap:8px; padding:0 0 4px; }
    .int-pill { flex:1; padding:9px 4px; border-radius:6px; border:1.5px solid var(--b);
      background:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:11px;
      font-weight:700; letter-spacing:.5px; text-transform:uppercase; cursor:pointer;
      transition:all .2s; text-align:center; }
    .int-pill.sel { border-color:var(--acc); color:#000; background:var(--acc); }
    /* Activity in sessions list */
    .ses-card.act { border-left-color:var(--sage); }
    .ses-act-meta { font-size:11px; color:var(--muted); margin-top:2px; display:flex; gap:8px; }
    .int-badge { font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      padding:1px 5px; border-radius:3px; }
    .int-suave { background:rgba(138,158,140,.15); color:var(--sage); }
    .int-moderada { background:rgba(200,160,144,.15); color:var(--rose,#c8a090); }
    .int-intensa { background:rgba(255,80,60,.15); color:#ff6b5b; }
    /* ── TEMPLATE META (ciclo + dia) ─────────── */
    .tpl-meta { padding:10px 14px 8px; border-bottom:1px solid var(--b); background:var(--s2); flex-shrink:0; }
    .tpl-meta-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .tpl-meta-row:last-child { margin-bottom:0; }
    .tpl-meta-lbl { font-family:'DM Sans',sans-serif; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--mut); min-width:34px; }
    .meta-pills { display:flex; gap:5px; flex-wrap:wrap; }
    .meta-pill { height:26px; padding:0 12px; border-radius:20px; border:1px solid var(--b); background:none; color:var(--mut); font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:.06em; cursor:pointer; transition:all .2s; }
    .meta-pill:active { opacity:.7; }
    .meta-pill.sel { background:var(--acc); border-color:var(--acc); color:#000; }
    /* ── EMPTY STATE ─────────────────────────── */
    .empty { display:flex; flex-direction:column; align-items:center;
      gap:12px; padding:60px 40px; text-align:center; }
    .empty svg { opacity:.18; }
    .empty p { color:var(--mut); font-size:17px; font-weight:600; line-height:1.4; }

    /* ── SESSION EDITOR ──────────────────────── */
    .ex-block { margin:10px 12px 0; background:var(--s1);
      border:1px solid var(--b); border-radius:var(--r); overflow:hidden; }
    .ex-hdr { padding:11px 13px; display:flex; align-items:center; gap:10px;
      border-bottom:1px solid var(--b); flex-wrap:wrap; }
    .ex-name { flex:1; min-width:140px; font-family:'Bebas Neue',sans-serif; font-size:18px; font-weight:400; letter-spacing:.5px;
      text-transform:uppercase; color:var(--txt); background:none; border:none;
      cursor:pointer; text-align:left; padding:0;
      display:flex; align-items:center; gap:6px; }
    .ex-name span { color:var(--acc); font-size:12px; }
    .modo-toggle { display:flex; gap:0; border:1px solid var(--b); border-radius:6px; overflow:hidden; flex-shrink:0; }
    .modo-btn { background:none; border:none; padding:5px 12px; font-family:'DM Sans',sans-serif;
      font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      color:var(--mut); cursor:pointer; transition:all .15s; }
    .modo-btn.sel { background:var(--acc); color:#000; }
    .serie-row { display:flex; align-items:center; gap:7px;
      padding:8px 13px; border-bottom:1px solid var(--b); }
    .serie-n { font-family:'JetBrains Mono',monospace; font-size:12px;
      color:var(--mut); width:18px; flex-shrink:0; text-align:center; }
    .serie-field { display:flex; align-items:stretch; background:var(--s3);
      border:1px solid var(--b); border-radius:5px; overflow:hidden; flex:1; }
    .serie-field label { font-size:10px; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--mut);
      padding:0 7px; display:flex; align-items:center;
      border-right:1px solid var(--b); flex-shrink:0; background:var(--s2); }
    .serie-input { font-family:'JetBrains Mono',monospace;
      font-size:21px; font-weight:700; color:var(--txt);
      background:none; border:none; outline:none;
      width:100%; text-align:center; padding:7px 4px;
      -moz-appearance:textfield; }
    .serie-input::-webkit-outer-spin-button,
    .serie-input::-webkit-inner-spin-button { -webkit-appearance:none; }
    .serie-input:focus { background:rgba(200,255,0,.06); }
    .serie-del { width:32px; height:32px; border:none; background:none;
      color:var(--mut); border-radius:5px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .serie-del:active { background:rgba(255,59,48,.15); color:var(--red); }
    .ex-foot { display:flex; border-top:1px solid var(--b); }
    .ex-foot-btn { flex:1; height:44px; border:none; background:none; color:var(--acc);
      cursor:pointer; font-family:'DM Sans',sans-serif;
      font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:5px; }
    .ex-foot-btn:active { background:var(--acc2); }
    .ex-foot-btn+.ex-foot-btn { border-left:1px solid var(--b); }
    .ex-foot-btn.del { color:#555; }
    .ex-foot-btn.del:active { color:var(--red); background:rgba(255,59,48,.08); }
    .btn-add-ex { margin:10px 12px 0; width:calc(100% - 24px); height:50px;
      border:1.5px dashed var(--b); background:none; border-radius:var(--r);
      cursor:pointer; color:var(--acc);
      font-family:'DM Sans',sans-serif;
      font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-add-ex:active { background:var(--acc2); border-style:solid; }

    /* ── PLANTILLA EDITOR (screen) ───────────── */
    .tpl-ex-row { display:flex; align-items:center; gap:10px;
      padding:13px 14px; border-bottom:1px solid var(--b); }
    .tpl-ex-name { font-family:'Bebas Neue',sans-serif; flex:1; font-size:18px; font-weight:400; letter-spacing:.04em; cursor:pointer; }
    .tpl-ex-name:active { color:var(--acc); }
    .tpl-ex-del { width:36px; height:36px; border:none; background:none;
      color:var(--mut); border-radius:5px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .tpl-ex-del:active { background:rgba(255,59,48,.15); color:var(--red); }
    .tpl-ex-num { font-family:'JetBrains Mono',monospace; font-size:12px;
      color:var(--acc); width:22px; flex-shrink:0; text-align:center; }

    /* ── OVERLAYS / SHEETS ───────────────────── */
    .overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.72);
      display:flex; align-items:flex-end;
      opacity:0; pointer-events:none; transition:opacity .2s; }
    .overlay.open { opacity:1; pointer-events:all; }
    .sheet { width:100%; background:var(--s1);
      border-radius:14px 14px 0 0; border-top:1px solid var(--b);
      padding-bottom:max(16px,env(safe-area-inset-bottom));
      max-height:82vh; display:flex; flex-direction:column;
      transform:translateY(16px); transition:transform .22s cubic-bezier(.4,0,.2,1); }
    .overlay.open .sheet { transform:translateY(0); }
    .sheet-hdr { padding:14px 16px; display:flex; align-items:center;
      justify-content:space-between; border-bottom:1px solid var(--b); flex-shrink:0; }
    .sheet-hdr-title { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700;
      letter-spacing:1.8px; text-transform:uppercase; color:var(--mut); }
    .search-wrap { margin:10px 12px; flex-shrink:0;
      display:flex; align-items:center; gap:8px;
      background:var(--s3); border:1px solid var(--b);
      border-radius:var(--r); padding:0 12px; }
    .search-wrap svg { flex-shrink:0; color:var(--mut); }
    .search-wrap input { flex:1; background:none; border:none; outline:none;
      color:var(--txt); caret-color:var(--acc);
      font-family:'DM Sans',sans-serif;
      font-size:16px; padding:11px 0; }
    .search-wrap input::placeholder { color:var(--mut); }
    .picker-items { overflow-y:auto; flex:1; padding:4px 8px 8px; }
    .picker-item { padding:12px 12px; border-radius:6px; cursor:pointer;
      font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500;
      display:flex; align-items:center; gap:10px; }
    .picker-item:active { background:var(--s3); }
    .picker-item.new { color:var(--acc); font-weight:700; }

    .toast.show { transform:translateX(-50%) translateY(0); }
    svg { display:block; }
  </style>
</head>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────────────────────
const LS = 'gym_manu_v1';

const PREDEFINED = [
  'Press banca','Press inclinado','Press declinado','Aperturas cable','Fondos pecho','Fondos lastrados',
  'Press militar','Press Arnold','Push press','Elevaciones laterales','Elevaciones frontales',
  'Pájaros','Face pulls',
  'Plyo push-ups','Push-ups explosivos',
  'Muscle-up progresión',
  'Sentadilla','Sentadilla búlgara','Bulgarian split squat explosivo','Prensa','Zancadas','Extensiones cuádriceps',
  'Goblet squat','Box jump','CMJ',
  'Peso muerto','Peso muerto rumano','Hip thrust','Abducción cadera',
  'Curl femoral','Buenos días',
  'KB swing 2 brazos','KB swing 1 brazo','KB press 1 brazo','KB press bilateral',
  'KB thruster','KB halos','KB row',
  'Remo barra','Remo mancuerna','Remo cable','Remo explosivo KB','TRX row','Jalones polea','Pull-ups','Dominadas',
  'Curl bíceps barra','Curl mancuerna','Curl martillo','Curl concentrado',
  'Tríceps polea','Tríceps francés','Extensión tríceps cabeza','Fondos tríceps',
  'Pallof press','Plancha','Plancha RKC','Crunch','Elevación piernas','Ab wheel','Russian twist',
  'Mountain climbers','Burpee','Burpee explosivo',
  'Sprints 20m','Sprints 40m','Sprints 200m',
];

const PRESET_TPLS = [
  { id:'pt-b-l', ciclo:'B', dia:'Lunes',     nombre:'B · Lunes — Potencia Superior',     ejercicios:['Push press','Plyo push-ups','KB press 1 brazo','Muscle-up progresión','Remo explosivo KB'] },
  { id:'pt-b-m', ciclo:'B', dia:'Miércoles', nombre:'B · Miércoles — Potencia Inferior', ejercicios:['Box jump','KB swing 2 brazos','Bulgarian split squat explosivo','Pallof press','KB halos'] },
  { id:'pt-b-v', ciclo:'B', dia:'Viernes',   nombre:'B · Viernes — Full Body Explosivo', ejercicios:['Sprints 20m','TRX row / KB row','CMJ','KB thruster','KB swing 1 brazo','Burpee explosivo'] },
  { id:'pt-c-l', ciclo:'C', dia:'Lunes',     nombre:'C · Lunes — Circuito Full Body',    ejercicios:['Goblet squat','KB press bilateral','Remo KB','Push-ups explosivos','Mountain climbers'] },
  { id:'pt-c-m', ciclo:'C', dia:'Miércoles', nombre:'C · Miércoles — Tabata Inferior',   ejercicios:['KB swing 2 brazos','Goblet squat','KB halos','Mountain climbers'] },
  { id:'pt-c-v', ciclo:'C', dia:'Viernes',   nombre:'C · Viernes — HIIT Completo',       ejercicios:['Sprints 200m','KB thruster','Burpee','KB swing 2 brazos','Tabata burpees'] },
  { id:'pt-a-l', ciclo:'A', dia:'Lunes',     nombre:'A · Lunes — Push',                  ejercicios:['Press banca','Press militar','Fondos lastrados','Push-ups explosivos','Face pull'] },
  { id:'pt-a-m', ciclo:'A', dia:'Miércoles', nombre:'A · Miércoles — Pierna + Core',     ejercicios:['Sentadilla','Romanian Deadlift','KB swings','Pallof press','Plancha RKC'] },
  { id:'pt-a-v', ciclo:'A', dia:'Viernes',   nombre:'A · Viernes — Pull + Integración',  ejercicios:['Dominadas lastradas','Remo barra','KB swing 1 brazo','Sprints 40m','Curl bíceps barra'] },
];
let db = loadDB();
initRutinas();
let ses = null;      // sesión activa
let sesIdx = -1;



let tpl = null;      // plantilla en edición
let tplOrigin = 'home'; // which screen opened tpl editor
let tplIdx = -1;

// picker context: 'session' | 'tpl-edit'
// picker target: null = añadir, number = renombrar exercise[n]
let pickerCtx = 'session';
let pickerFor = null;

function loadDB() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) {
      const p = JSON.parse(raw);
      p.ejercicios_predefinidos = [...new Set([...PREDEFINED, ...(p.ejercicios_predefinidos||[])])];
      p.plantillas = p.plantillas || [];
      return p;
    }
  } catch(e) {}
  const fresh = { version:1, ejercicios_predefinidos:[...PREDEFINED], sesiones:[], plantillas: PRESET_TPLS.map(t=>({...t})) };
  return fresh;
}

function saveDB() { db.last_modified = Date.now(); localStorage.setItem(LS, JSON.stringify(db)); }

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function showScreen(id) {
  const all = ['scr-home','scr-session','scr-tpl-edit','scr-rutinas'];
  all.forEach(sid => {
    const el = document.getElementById(sid);
    el.classList.remove('active','behind');
  });
  // Stack: behind is whatever was active before
  if (id === 'scr-session') {
    const prevActive = document.querySelector('.screen.active');
    if (prevActive) prevActive.classList.add('behind');
    document.getElementById('scr-session').classList.add('active');
  } else if (id === 'scr-tpl-edit') {
    const prevActive = document.querySelector('.screen.active');
    if (prevActive) prevActive.classList.add('behind');
    document.getElementById('scr-tpl-edit').classList.add('active');
  } else if (id === 'scr-rutinas') {
    const prevActive = document.querySelector('.screen.active');
    if (prevActive) prevActive.classList.add('behind');
    document.getElementById('scr-rutinas').classList.add('active');
  } else {
    document.getElementById('scr-home').classList.add('active');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// HOME
// ─────────────────────────────────────────────────────────────────────────────
function renderHome() { renderSessions(); }


// ─────────────────────────────────────────────────────────────────────────────
// CICLO GROUPS (shared renderer, mode: 'pick' | 'manage')
// ─────────────────────────────────────────────────────────────────────────────

// ─── ACTIVITY LOGGING ─────────────────────────────────────────────────────────
let actNombre = '';
let actDuracion = 60;
let actIntensidad = 'moderada';
let actEditIdx = -1;  // -1 = nueva, >=0 = editando sesión existente
const ACT_EMOJIS = {'Tenis de mesa':'🏓','Caminata':'🚶','Tenis':'🎾','Carrera':'🏃','Bicicleta':'🚴','Natación':'🏊'};

function openActivityEdit(idx) {
  const s = db.sesiones[idx];
  if (!s) return;
  actEditIdx = idx;
  actNombre = s.nombre;
  actDuracion = s.duracion || 45;
  actIntensidad = s.intensidad || 'moderada';
  document.getElementById('act-title').textContent = (ACT_EMOJIS[s.nombre] || '⚡') + '  ' + s.nombre;
  document.getElementById('act-dur-val').textContent = actDuracion;
  document.getElementById('act-fecha').value = s.fecha || todayStr();
  document.getElementById('act-pasos').value = s.pasos || '';
  document.getElementById('act-pasos-block').style.display = s.nombre === 'Caminata' ? 'block' : 'none';
  document.getElementById('act-del-btn').style.display = 'block';
  document.querySelectorAll('.int-pill').forEach(b => b.classList.toggle('sel', b.dataset.int === actIntensidad));
  document.getElementById('ov-activity').classList.add('open');
}

function deleteActivity() {
  if (actEditIdx < 0) return;
  db.sesiones.splice(actEditIdx, 1);
  actEditIdx = -1;
  saveDB();
  closeOv('ov-activity');
  renderHome();
  gdAutoSave().catch(() => {});
  toast('Actividad eliminada');
}

function openActivityLog(nombre) {
  actEditIdx = -1;
  actNombre = nombre;
  actDuracion = nombre === 'Tenis de mesa' ? 60 : 45;
  actIntensidad = 'moderada';
  document.getElementById('act-title').textContent = (ACT_EMOJIS[nombre] || '⚡') + '  ' + nombre;
  document.getElementById('act-dur-val').textContent = actDuracion;
  document.getElementById('act-fecha').value = todayStr();
  document.getElementById('act-pasos').value = '';
  document.getElementById('act-pasos-block').style.display = nombre === 'Caminata' ? 'block' : 'none';
  document.getElementById('act-del-btn').style.display = 'none';
  document.querySelectorAll('.int-pill').forEach(b => b.classList.toggle('sel', b.dataset.int === actIntensidad));
  closeOv('ov-session-picker');
  document.getElementById('ov-activity').classList.add('open');
}

function openCustomActivity() {
  const nombre = prompt('Nombre de la actividad:');
  if (nombre && nombre.trim()) openActivityLog(nombre.trim());
}

function adjustDur(delta) {
  actDuracion = Math.max(5, Math.min(300, actDuracion + delta));
  document.getElementById('act-dur-val').textContent = actDuracion;
}

function setIntensidad(val) {
  actIntensidad = val;
  document.querySelectorAll('.int-pill').forEach(b => b.classList.toggle('sel', b.dataset.int === val));
}

function saveActivity() {
  const fecha = document.getElementById('act-fecha').value || todayStr();
  const pasos = parseInt(document.getElementById('act-pasos').value) || 0;
  if (actEditIdx >= 0) {
    const s = db.sesiones[actEditIdx];
    s.fecha = fecha;
    s.duracion = actDuracion;
    s.intensidad = actIntensidad;
    if (actNombre === 'Caminata') { if (pasos > 0) s.pasos = pasos; else delete s.pasos; }
    actEditIdx = -1;
  } else {
    const session = {
      id: String(Date.now()), fecha: fecha,
      nombre: actNombre, tipo: 'actividad',
      duracion: actDuracion, intensidad: actIntensidad,
      ejercicios: []
    };
    if (actNombre === 'Caminata' && pasos > 0) session.pasos = pasos;
    db.sesiones.push(session);
  }
  db.sesiones.sort((a,b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
  saveDB();
  closeOv('ov-activity');
  renderHome();
  gdAutoSave().catch(() => {});
  toast((ACT_EMOJIS[actNombre] || '⚡') + ' ' + actNombre + ' guardado');
}

// ─────────────────────────────────────────────────────────────────────────────
// RUTINAS SYSTEM
// ─────────────────────────────────────────────────────────────────────────────
let editingRutinaId = null;
let editingDiaIdx   = -1;
let pickerOpenRutinas = new Set();

function initRutinas() {
  if (db.rutinas) return;
  db.rutinas = [];
  const nameMap = { A:'Ciclo A — Fuerza Funcional', B:'Ciclo B — Potencia & Explosividad', C:'Ciclo C — Metabólico & Recomposición' };
  const cicloMap = {};
  (db.plantillas || []).forEach(p => {
    if (!p.ciclo) return;
    if (!cicloMap[p.ciclo]) cicloMap[p.ciclo] = { id:'r_'+p.ciclo, nombre:nameMap[p.ciclo]||'Ciclo '+p.ciclo, dias:[] };
    const sesName = p.nombre.includes('—') ? p.nombre.split('—').slice(1).join('—').trim() : p.nombre;
    cicloMap[p.ciclo].dias.push({ id:'d_'+p.id, dia:p.dia||'', nombre:sesName, ejercicios:p.ejercicios||[] });
  });
  ['B','C','A'].forEach(ciclo => { if (cicloMap[ciclo]) db.rutinas.push(cicloMap[ciclo]); });
  saveDB();
}

function openRutinasScreen() {
  renderRutinasScreen();
  showScreen('scr-rutinas');
}

function renderRutinasScreen() {
  const el = document.getElementById('rutinas-body');
  if (!db.rutinas || !db.rutinas.length) {
    el.innerHTML = `<div class="empty"><p>Sin rutinas todavía.<br>Crea la primera con +</p></div>`;
    return;
  }
  let html = '';
  db.rutinas.forEach(rutina => {
    html += `<div class="rutina-card">
      <div class="rutina-hdr">
        <div class="rutina-name" contenteditable="true"
          onblur="renameRutina('${rutina.id}',this.textContent.trim())"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
        >${esc(rutina.nombre)}</div>
        <button class="ico red" style="width:36px;height:36px;flex-shrink:0" onclick="deleteRutina('${rutina.id}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
      </div>
      ${rutina.dias.map((dia,idx) => `
        <div class="rutina-dia-row" onclick="openDiaEdit('${rutina.id}',${idx})">
          <div class="rdr-day">${dia.dia||'—'}</div>
          <div class="rdr-name">${esc(dia.nombre)}</div>
          <div class="rdr-count">${dia.ejercicios.length} ej.</div>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>`).join('')}
      <button class="btn-add-dia" onclick="openDiaEdit('${rutina.id}',-1)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Añadir día
      </button>
    </div>`;
  });
  el.innerHTML = html;
}

function addNewRutina() {
  if (!db.rutinas) db.rutinas = [];
  const r = { id:'r_'+Date.now(), nombre:'Nueva rutina', dias:[] };
  db.rutinas.push(r);
  saveDB();
  renderRutinasScreen();
  // Focus the new rutina name
  setTimeout(() => {
    const divs = document.querySelectorAll('.rutina-name');
    if (divs.length) divs[divs.length-1].focus();
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(divs[divs.length-1]);
    sel.removeAllRanges();
    sel.addRange(range);
  }, 50);
}

function renameRutina(id, nombre) {
  const r = db.rutinas.find(r => r.id === id);
  if (r && nombre) { r.nombre = nombre; saveDB(); }
}

function deleteRutina(id) {
  openDelConfirm('Eliminar rutina', '¿Eliminar esta rutina? No se puede deshacer.', () => {
    db.rutinas = db.rutinas.filter(r => r.id !== id);
    saveDB(); renderRutinasScreen(); toast('Rutina eliminada');
  });
}

function openDiaEdit(rutinaId, diaIdx) {
  editingRutinaId = rutinaId;
  editingDiaIdx   = diaIdx;
  const rutina = db.rutinas.find(r => r.id === rutinaId);
  if (diaIdx === -1) {
    tpl = { id:'d_'+Date.now(), dia:'', nombre:'Nueva sesión', ejercicios:[] };
  } else {
    tpl = JSON.parse(JSON.stringify(rutina.dias[diaIdx]));
  }
  const titleEl = document.getElementById('tpl-edit-title');
  titleEl.textContent = tpl.nombre;
  titleEl.contentEditable = 'true';
  document.querySelectorAll('#tpl-dia-pills .meta-pill').forEach(b =>
    b.classList.toggle('sel', b.dataset.dia === (tpl.dia||'')));
  renderTplEdit();
  showScreen('scr-tpl-edit');
}

function saveDia() {
  if (!tpl || !editingRutinaId) return;
  const titleEl = document.getElementById('tpl-edit-title');
  tpl.nombre = titleEl.textContent.trim() || 'Sin nombre';
  const diaBtn = document.querySelector('#tpl-dia-pills .meta-pill.sel');
  if (diaBtn) tpl.dia = diaBtn.dataset.dia || tpl.dia;
  const rutina = db.rutinas.find(r => r.id === editingRutinaId);
  if (!rutina) return;
  if (editingDiaIdx === -1) rutina.dias.push(tpl);
  else rutina.dias[editingDiaIdx] = tpl;
  saveDB();
}

function sesFromDia(rutinaId, diaIdx) {
  const rutina = db.rutinas ? db.rutinas.find(r => r.id === rutinaId) : null;
  if (!rutina || !rutina.dias[diaIdx]) return;
  const dia = rutina.dias[diaIdx];
  ses = { id:String(Date.now()), fecha:todayStr(), nombre:dia.nombre,
    ejercicios:dia.ejercicios.map(n=>({nombre:n,series:[]})) };
  sesIdx = -1;
  startSesScreen();
}

// ─── SESSION PICKER ───────────────────────────────────────────────────────────
function openSessionPicker() {
  renderSessionPicker();
  document.getElementById('ov-session-picker').classList.add('open');
}

function renderSessionPicker() {
  const el = document.getElementById('sp-ciclos');
  const rutinas = db.rutinas || [];
  if (!rutinas.length) {
    el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--mut);font-family:DM Sans,sans-serif;font-size:14px">Sin rutinas todavía.<br>Crea una en Gestionar Rutinas.</div>';
    return;
  }
  // Collapsed by default — everything fits on screen; tap a rutina to expand
  let html = '';
  rutinas.forEach(rutina => {
    const isOpen = pickerOpenRutinas.has(rutina.id);
    html += `<div class="pk-rutina">
      <div class="pk-rutina-hdr" onclick="togglePickerRutina('${rutina.id}')">
        <div class="pk-rutina-name">${esc(rutina.nombre)}</div>
        <svg class="cg-chev ${isOpen?'open':''}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      ${isOpen ? `<div class="pk-rutina-body">${rutina.dias.map((dia,idx) =>
        `<div class="pk-dia-row" onclick="sesFromDia('${rutina.id}',${idx});closeOv('ov-session-picker')">
          <div class="pk-dia-day">${dia.dia||'—'}</div>
          <div class="pk-dia-name">${esc(dia.nombre)}</div>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>`).join('')}</div>` : ''}
    </div>`;
  });
  el.innerHTML = html;
}

function togglePickerRutina(id) {
  if (pickerOpenRutinas.has(id)) pickerOpenRutinas.delete(id);
  else pickerOpenRutinas.add(id);
  renderSessionPicker();
}

function closeOv(id) { document.getElementById(id).classList.remove('open'); }

// Session picker events
document.getElementById('sp-close').addEventListener('click', () => closeOv('ov-session-picker'));
document.getElementById('sp-blank').addEventListener('click', () => { closeOv('ov-session-picker'); newSes(); });
document.getElementById('ov-session-picker').addEventListener('click', e => {
  if (e.target === document.getElementById('ov-session-picker')) closeOv('ov-session-picker');
});

// Rutinas screen events
document.getElementById('rutinas-back').addEventListener('click', () => showScreen('scr-home'));
document.getElementById('rutinas-new').addEventListener('click', addNewRutina);

// Home action buttons
document.getElementById('btn-iniciar').addEventListener('click', openSessionPicker);
document.getElementById('btn-plantillas').addEventListener('click', openRutinasScreen);

function renderTplHome() {
  const sec = document.getElementById('tpl-home-section');
  if (!sec) return;
  const dummy_groups_other = [];
  if (dummy_groups_other.length) {
    html += `<div class="list-label" style="margin-top:10px">Mis plantillas</div><div class="tpl-grid">`;

      html += `<div class="tpl-card">

            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            EDITAR
          </button>
        </div>
      </div>`;

function renderSessions() {
  const el = document.getElementById('sessions-list');
  if (!db.sesiones.length) {
    el.innerHTML = `<div class="empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <p>Sin sesiones todavía.<br>Empieza la primera.</p>
    </div>`;
    return;
  }
  const sorted = db.sesiones.map((s,i)=>({...s,_i:i})).reverse();
  let html = `<div class="list-label">Sesiones</div>`;
  sorted.forEach(s => {
    if (s.tipo === 'actividad') {
      const emoji = ACT_EMOJIS[s.nombre] || '⚡';
      const intLabel = {'suave':'Suave','moderada':'Moderada','intensa':'Intensa'}[s.intensidad] || 'Moderada';
      const intCls = 'int-' + (s.intensidad || 'moderada');
      const pasosTxt = s.pasos ? ` · ${s.pasos.toLocaleString('es-ES')} pasos` : '';
      html += `<div class="card">
        <div class="card-main" data-open-ses="${s._i}">
          <div class="card-info">
            <div class="card-date">${fmtDate(s.fecha)}</div>
            <div class="card-name">${emoji} ${esc(s.nombre)}</div>
            <div class="card-meta">${s.duracion || 0} min${pasosTxt} &nbsp;<span class="int-badge ${intCls}">${intLabel}</span></div>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>`;
      return;
    }
    const ex = s.ejercicios.length;
    const sets = s.ejercicios.reduce((a,e)=>a+e.series.length,0);
    html += `<div class="card">
      <div class="card-main" data-open-ses="${s._i}">
        <div class="card-info">
          <div class="card-date">${fmtDate(s.fecha)}</div>
          <div class="card-name">${esc(s.nombre)}</div>
          <div class="card-meta">${ex} ejercicio${ex!==1?'s':''} · ${sets} serie${sets!==1?'s':''}</div>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="card-repeat" data-repeat-ses="${s._i}">
        <span>↺ Repetir sesión</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

const tplHomeSection = document.getElementById('tpl-home-section');
if (tplHomeSection) {
  tplHomeSection.addEventListener('click', e => {
    const use  = e.target.closest('[data-use-tpl]');

// autosave
let saveTimer;
function autosave() {
  dot(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { commitSave(); dot(false); }, 400);
}
function dot(on) { document.getElementById('save-dot').classList.toggle('on', on); }

function commitSave(exiting = false) {
  if (!ses) return;
  const totalSeries = ses.ejercicios.reduce((a,e) => a + e.series.length, 0);
  if (totalSeries === 0) {
    // Sin series: el autosave no persiste nada; al salir se descarta del todo
    if (exiting) {
      if (sesIdx !== -1) db.sesiones.splice(sesIdx, 1);
      ses = null; sesIdx = -1;
      saveDB();
      toast('Sesión vacía descartada');
    }
    return;
  }
  const t = document.getElementById('ses-title');
  ses.nombre = t.textContent.trim() || ses.nombre;
  if (sesIdx === -1) { db.sesiones.push(ses); sesIdx = db.sesiones.length - 1; }
  else db.sesiones[sesIdx] = ses;
  saveDB();
}

function addExSes(nombre) {
  ses.ejercicios.push({nombre,series:[]});
  autosave(); renderSession();
  setTimeout(() => document.getElementById('ses-scroll').scrollTo({top:99999,behavior:'smooth'}), 60);
}
function renameExSes(ei, nombre) {
  ses.ejercicios[ei].nombre = nombre; autosave();
  const btn = document.querySelector(`#ex${ei} .ex-name`);
  if (btn) btn.innerHTML = `${esc(nombre)} <span>▾</span>`;
}
function removeExSes(ei) { ses.ejercicios.splice(ei,1); autosave(); renderSession(); }
function addSet(ei) {
  const ex = ses.ejercicios[ei];
  if (ex.modo === 'tabata') ex.series.push({rondas:'',seg:'',kg:''});
  else ex.series.push({reps:'',kg:''});
  autosave(); renderSession();
  setTimeout(() => {
    const inputs = document.querySelectorAll(`#ex${ei} .serie-input`);
    const offset = ex.modo === 'tabata' ? 3 : 2;
    if (inputs.length) inputs[inputs.length-offset].focus();
  }, 60);
}
function dupLastSet(ei) {
  const ex = ses.ejercicios[ei];
  const series = ex.series;
  if (!series.length) { addSet(ei); return; }
  const last = series[series.length-1];
  if (ex.modo === 'tabata') series.push({rondas:last.rondas,seg:last.seg,kg:last.kg});
  else series.push({reps:last.reps,kg:last.kg});
  autosave(); renderSession(); toast('Serie duplicada');
}
function removeSet(ei,si) { ses.ejercicios[ei].series.splice(si,1); autosave(); renderSession(); }

function openPicker(forIdx) {
  pickerFor = forIdx;
  document.getElementById('picker-q').value = '';
  renderPicker('');
  document.getElementById('picker-overlay').classList.add('open');
  setTimeout(() => document.getElementById('picker-q').focus(), 120);
}
function closePicker() {
  closeOverlay('picker-overlay');
  document.getElementById('picker-q').blur();
}
function renderPicker(q) {
  const qn = q.trim().toLowerCase();
  const matches = db.ejercicios_predefinidos
    .filter(n => !qn || n.toLowerCase().includes(qn))
    .sort((a,b) => a.localeCompare(b,'es'));
  let html = '';
  const exact = db.ejercicios_predefinidos.some(n => n.toLowerCase()===qn);
  if (qn && !exact) {
    const cap = q.trim().charAt(0).toUpperCase()+q.trim().slice(1);
    html += `<div class="picker-item new" data-new="${esc(cap)}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Añadir "${esc(cap)}"</div>`;
  }
  matches.forEach(n => { html += `<div class="picker-item" data-pick="${esc(n)}">${esc(n)}</div>`; });
  if (!html) html = `<div style="padding:28px;text-align:center;color:var(--mut);font-size:16px">Sin resultados</div>`;
  document.getElementById('picker-items').innerHTML = html;
}

document.getElementById('picker-close').addEventListener('click', closePicker);
document.getElementById('picker-overlay').addEventListener('click', e => {
  if (e.target===document.getElementById('picker-overlay')) closePicker();
});

document.getElementById('picker-items').addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  const newEx = e.target.closest('[data-new]');
  if (pick)  { selectEx(pick.dataset.pick); return; }
  if (newEx) {
    const n = newEx.dataset.new;
    if (!db.ejercicios_predefinidos.includes(n)) { db.ejercicios_predefinidos.push(n); saveDB(); }
    selectEx(n); toast(`"${n}" guardado`);
  }
});

function selectEx(nombre) {
  closePicker();
  if (pickerCtx === 'session') {
    if (pickerFor === null) addExSes(nombre);
    else renameExSes(pickerFor, nombre);
  } else { // tpl-edit
    if (pickerFor === null) { tpl.ejercicios.push(nombre); renderTplEdit(); }
    else { tpl.ejercicios[pickerFor] = nombre; renderTplEdit(); }
  }
}

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('es-ES',
    {day:'2-digit',month:'short',year:'numeric'}).replace('.','');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
renderHome();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

// ─────────────────────────────────────────────────────────────────────────────
// GOOGLE DRIVE
// ─────────────────────────────────────────────────────────────────────────────
const GD_CLIENT_ID = '165027269678-89l436h0ujttrr1kl2abmf2bklovln79.apps.googleusercontent.com';
const GD_SCOPE     = 'https://www.googleapis.com/auth/drive.file';
const GD_FOLDER    = 'GymTracker';
const GD_FILE      = 'gym_sessions.json';
const LS_TOKEN     = 'gd_token';
const LS_EXP       = 'gd_exp';
const LS_FID       = 'gd_fid';
const LS_FXID      = 'gd_fxid';

let gdTokenClient = null;
let gdToken       = null;
let gdFolderId    = localStorage.getItem(LS_FID)  || null;
let gdFileId      = localStorage.getItem(LS_FXID) || null;
let gdRefreshTimer = null;
let gdSilentTried  = false;

function gdScheduleRefresh() {
  clearTimeout(gdRefreshTimer);
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!exp) return;
  // Refresh 2 min before expiry, silently
  const delay = Math.max(5000, exp - Date.now() - 120000);
  gdRefreshTimer = setTimeout(() => gdSilentRefresh(), delay);
}

function gdSilentRefresh() {
  if (!gdTokenClient) return;
  try {
    // prompt:'' asks Google for a fresh token WITHOUT showing any dialog
    gdTokenClient.requestAccessToken({ prompt: '' });
  } catch(e) { /* will fall back to manual reconnect button */ }
}

function gdInitClient() {
  if (typeof google === 'undefined' || !google.accounts) return;
  gdTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GD_CLIENT_ID,
    scope: GD_SCOPE,
    callback: async (resp) => {
      if (resp.error) {
        // Silent refresh failed (needs interaction) → show reconnect UI, don't nag
        if (resp.error === 'interaction_required' || resp.error === 'access_denied') {
          gdToken = null; gdUpdateUI(false);
        } else {
          toast('Error al conectar Drive');
        }
        return;
      }
      gdToken = resp.access_token;
      const exp = Date.now() + (resp.expires_in - 60) * 1000;
      localStorage.setItem(LS_TOKEN, gdToken);
      localStorage.setItem(LS_EXP,   String(exp));
      gdUpdateUI(true);
      gdScheduleRefresh();
      await gdEnsureFolder().catch(() => {});
    }
  });
  // Restore token if still valid
  const saved = localStorage.getItem(LS_TOKEN);
  const exp   = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (saved && Date.now() < exp) {
    gdToken = saved;
    gdUpdateUI(true);
    gdScheduleRefresh();
    gdAutoLoad().catch(() => {});
  } else if (saved) {
    // Had a token before but expired → try to renew silently, no dialog
    gdSilentRefresh();
  }
}

function gdHandleTap() {
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) {
    if (!gdTokenClient) { toast('Cargando Google…'); return; }
    gdToken = null;
    // Explicit user tap: try silent first, but allow consent dialog if needed
    gdTokenClient.requestAccessToken(localStorage.getItem(LS_TOKEN) ? { prompt: '' } : {});
  }
}

function gdUpdateUI(on) {
  document.getElementById('gd-dot').style.display = on ? 'block' : 'none';
  const driveOff = document.getElementById('drive-off');
  const driveOn  = document.getElementById('drive-on');
  if (driveOff) driveOff.style.display = on ? 'none' : 'flex';
  if (driveOn)  driveOn.style.display  = on ? 'block' : 'none';
  // If we had a token before, show "Reconectar" instead of "Conectar"
  const lbl = document.getElementById('drive-off-label');
  if (lbl && !on) {
    lbl.textContent = localStorage.getItem(LS_TOKEN) ? 'Reconectar Google Drive' : 'Conectar Google Drive';
  }
}

function gdDisconnect() {
  if (gdToken) try { google.accounts.oauth2.revoke(gdToken, () => {}); } catch(e) {}
  gdToken = null; gdFolderId = null; gdFileId = null;
  [LS_TOKEN, LS_EXP, LS_FID, LS_FXID].forEach(k => localStorage.removeItem(k));
  gdUpdateUI(false);
  closeOv('ov-drive');
  toast('Drive desconectado');
}

async function gdFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { Authorization: `Bearer ${gdToken}`, ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    gdToken = null;
    gdUpdateUI(false);
    gdSilentRefresh(); // try to get a fresh token in background
    throw new Error('token_expired');
  }
  return res;
}

async function gdEnsureFolder() {
  if (gdFolderId) return gdFolderId;
  const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${GD_FOLDER}%27+and+mimeType%3D%27application%2Fvnd.google-apps.folder%27+and+trashed%3Dfalse&fields=files(id)`);
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    gdFolderId = data.files[0].id;
  } else {
    const cr = await gdFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: GD_FOLDER, mimeType: 'application/vnd.google-apps.folder' })
    });
    const folder = await cr.json();
    gdFolderId   = folder.id;
  }
  localStorage.setItem(LS_FID, gdFolderId);
  return gdFolderId;
}

async function gdEnsureFileId() {
  if (gdFileId) return gdFileId;
  const fid  = await gdEnsureFolder();
  const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${GD_FILE}%27+and+%27${fid}%27+in+parents+and+trashed%3Dfalse&fields=files(id)`);
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    gdFileId = data.files[0].id;
    localStorage.setItem(LS_FXID, gdFileId);
  }
  return gdFileId || null;
}

async function gdSave() {
  closeOv('ov-drive');
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) { toast('Conecta Drive primero'); return; }
  toast('Guardando en Drive…');
  try {
    const folderId = await gdEnsureFolder();
    const fileId   = await gdEnsureFileId();
    const content  = JSON.stringify(db, null, 2);
    const blob     = new Blob([content], { type: 'application/json' });
    const meta     = fileId ? { name: GD_FILE } : { name: GD_FILE, mimeType: 'application/json', parents: [folderId] };
    const form     = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', blob);
    const url    = fileId ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const method = fileId ? 'PATCH' : 'POST';
    const res    = await gdFetch(url, { method, body: form });
    const saved  = await res.json();
    if (!gdFileId && saved.id) { gdFileId = saved.id; localStorage.setItem(LS_FXID, gdFileId); }
    toast('Guardado en Drive ✓');
  } catch(e) { if (e.message !== 'token_expired') toast('Error al guardar'); }
}


async function gdAutoLoad() {
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) return;
  try {
    const fileId = await gdEnsureFileId();
    if (!fileId) return;
    const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (!data.sesiones) return;
    const driveTime = data.last_modified || 0;
    const localTime = db.last_modified  || 0;
    if (driveTime > localTime) {
      db = data;
      db.ejercicios_predefinidos = [...new Set([...PREDEFINED,...(db.ejercicios_predefinidos||[])])];
      db.plantillas = db.plantillas || [];
      if (!db.rutinas) initRutinas();
      saveDB(); renderHome();
      toast('☁ Sincronizado desde Drive');
    }
  } catch(e) { /* silent — local data kept */ }
}

async function gdAutoSave() {
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) return; // not connected, skip silently
  try {
    const folderId = await gdEnsureFolder();
    const fileId   = await gdEnsureFileId();
    const content  = JSON.stringify(db, null, 2);
    const blob     = new Blob([content], { type: 'application/json' });
    const meta     = fileId ? { name: GD_FILE } : { name: GD_FILE, mimeType: 'application/json', parents: [folderId] };
    const form     = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', blob);
    const url    = fileId ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const method = fileId ? 'PATCH' : 'POST';
    const res    = await gdFetch(url, { method, body: form });
    const saved  = await res.json();
    if (!gdFileId && saved.id) { gdFileId = saved.id; localStorage.setItem(LS_FXID, gdFileId); }
    toast('Sesión guardada ✓  ☁');
  } catch(e) { /* silent fail — local save already done */ }
}

async function gdLoad() {
  closeOv('ov-drive');
  const exp = parseInt(localStorage.getItem(LS_EXP) || '0');
  if (!gdToken || Date.now() >= exp) { toast('Conecta Drive primero'); return; }
  toast('Cargando desde Drive…');
  try {
    const fileId = await gdEnsureFileId();
    if (!fileId) { toast('Sin datos en Drive todavía'); return; }
    const res  = await gdFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (data.sesiones) {
      db = data;
      db.ejercicios_predefinidos = [...new Set([...PREDEFINED, ...(db.ejercicios_predefinidos || [])])];
      db.plantillas = db.plantillas || [];
      if (!db.rutinas) initRutinas();
      saveDB(); renderHome();
      toast('Cargado desde Drive ✓');
    } else { toast('Archivo no reconocido'); }
  } catch(e) { if (e.message !== 'token_expired') toast('Error al cargar'); }
}

// Init Drive when GIS is ready
;(function waitGIS() {
  if (typeof google !== 'undefined' && google.accounts) { gdInitClient(); }
  else { setTimeout(waitGIS, 400); }
})();
</script>
