<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Manu — Ciclo de 5 semanas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #F8F9FA;
    color: #111827;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .page { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  header h1 { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 3px; }
  header p  { font-size: 13px; color: #6B7280; }

  /* ── TABS ─────────────────────────────────────────────── */
  .tabs { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
  .tbtn {
    padding: 6px 18px; font-size: 12px; font-weight: 600;
    border-radius: 7px; border: 1px solid #D1D5DB;
    cursor: pointer; background: #F3F4F6; color: #6B7280;
    font-family: inherit; letter-spacing: .02em; transition: all .12s;
  }
  .tbtn:hover { background: #E5E7EB; }
  .tbtn.on  { color: #fff; border-color: transparent; }

  /* ── GRID CONTAINER ───────────────────────────────────── */
  .cal-wrap { background: #fff; border-radius: 12px; border: 1px solid #E5E7EB; overflow: hidden; }

  /* day headers */
  .dy-hdr {
    display: grid;
    grid-template-columns: 44px repeat(7, 1fr);
    border-bottom: 1px solid #E5E7EB;
    position: sticky; top: 0; z-index: 10;
    background: #fff;
  }
  .dh {
    padding: 7px 3px; text-align: center;
    font-size: 11px; font-weight: 600; color: #6B7280;
    border-left: 1px solid #E5E7EB;
  }
  .dh .sub { font-size: 9px; font-weight: 400; margin-top: 1px; }
  .dh.wk   { background: rgba(0,0,0,.025); }

  /* grid body */
  .gbody {
    display: grid;
    grid-template-columns: 44px repeat(7, 1fr);
    position: relative;
  }
  .tcol { position: relative; background: #FAFAFA; border-right: 1px solid #E5E7EB; }
  .tlbl {
    position: absolute; right: 6px;
    font-size: 9px; color: #9CA3AF;
    line-height: 1; transform: translateY(-50%);
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .dcol { position: relative; border-left: 1px solid #E5E7EB; }
  .dcol.wk { background: rgba(0,0,0,.015); }
  .hl  { position: absolute; left: 0; right: 0; border-top: 1px solid #F3F4F6; pointer-events: none; }
  .hl.maj { border-color: #E5E7EB; }

  /* events */
  .ev {
    position: absolute; left: 2px; right: 2px;
    border-radius: 5px; overflow: hidden;
    padding: 2px 5px; cursor: default;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .evl { font-size: 10px; font-weight: 600; color: #fff; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evt { font-size: 9px; color: rgba(255,255,255,.75); line-height: 1.2; }
  .ev.light .evl { color: #374151; }
  .ev.light .evt { color: #6B7280; }

  /* ── LEGEND ───────────────────────────────────────────── */
  .leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; padding: 12px 14px; background: #fff; border-radius: 10px; border: 1px solid #E5E7EB; }
  .li  { display: flex; align-items: center; gap: 6px; }
  .ld  { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .lt  { font-size: 11px; color: #6B7280; }

  .hid { display: none !important; }
</style>
</head>

const rendered = new Set();

function buildGrid(wk) {
  const W = WEEKS[wk];
  const gh = (EN - ST) * HH;

  let h = `<div class="dy-hdr"><div></div>`;
  DAYS.forEach((d, i) => {
    const isWk = i >= 5;
    const isTardesFree = isWk && wk === 'TARDES';
    h += `<div class="dh${isWk ? ' wk' : ''}" style="${isWk ? 'color:' + W.color : ''}">${d}${isTardesFree ? '<div class="sub" style="color:#15803D">finde libre</div>' : ''}</div>`;
  });
  h += `</div><div class="gbody" style="height:${gh}px"><div class="tcol" style="height:${gh}px">`;

  for (let hr = ST; hr <= EN; hr++) {
    const y = (hr - ST) * HH;
    const d = hr % 24;
    h += `<div class="tlbl" style="top:${y}px">${String(d).padStart(2,'0')}:00</div>`;
  }
  h += '</div>';

  for (let di = 0; di < 7; di++) {
    h += `<div class="dcol${di >= 5 ? ' wk' : ''}" style="height:${gh}px">`;
    for (let li = 0; li <= EN - ST; li++) {
      h += `<div class="hl${li % 2 === 0 ? ' maj' : ''}" style="top:${li * HH}px"></div>`;
    }
    W.events.filter(ev => ev.d === di).forEach(ev => {
      const top = tY(ev.s);
      const ht  = tH(ev.s, ev.e);
      const showTime = ht > 28;
      h += `<div class="ev${ev.x ? ' light' : ''}" style="top:${top+1}px;height:${ht-2}px;background:${ev.c}" title="${ev.l}  ${ev.s}–${ev.e}">
        <div class="evl">${ht > 12 ? ev.l : ''}</div>
        ${showTime ? `<div class="evt">${ev.s}–${ev.e}</div>` : ''}
      </div>`;
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function show(key) {
  active = key;
  if (!rendered.has(key)) {
    document.getElementById('wc-' + key).innerHTML = buildGrid(key);
    rendered.add(key);
  }
  document.querySelectorAll('.wc').forEach(el => el.classList.add('hid'));
  document.getElementById('wc-' + key).classList.remove('hid');
  document.querySelectorAll('.tbtn').forEach(b => { b.classList.remove('on'); b.style.background = ''; b.style.color = ''; });
  const btn = document.querySelector('[data-k="' + key + '"]');
  btn.classList.add('on');
  btn.style.background = WEEKS[key].color;
}

// Build tabs
const tabsEl = document.getElementById('tabs');
Object.keys(WEEKS).forEach(key => {
  const b = document.createElement('button');
  b.className = 'tbtn'; b.textContent = WEEKS[key].label; b.dataset.k = key;
  b.onclick = () => show(key);
  tabsEl.appendChild(b);
  const d = document.createElement('div');
  d.id = 'wc-' + key; d.className = 'wc hid';
  document.getElementById('cal').appendChild(d);
});

// Build legend
const legEl = document.getElementById('leg');
LEGEND.forEach(({ l, c }) => {
  legEl.innerHTML += `<div class="li"><div class="ld" style="background:${c}"></div><span class="lt">${l}</span></div>`;
});

show('LIBRE');

</html>
