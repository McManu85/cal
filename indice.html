<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel</title>
<style>
  :root{
    --bg: #0E0F0C;
    --surface: #16180F;
    --line: #2A2D1F;
    --text: #EDEFE4;
    --muted: #8C9077;
    --accent: #C7F464;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  main{width:100%; max-width:420px;}
  .header{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:28px;
  }
  h1{
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .version{
    font-size:11px;
    color:var(--accent);
    letter-spacing:0.02em;
    font-weight:500;
  }
  .cards{display:flex; flex-direction:column; gap:12px;}
  a.card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 22px;
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover, a.card:focus-visible{
    border-color:var(--accent);
    transform:translateX(2px);
  }
  a.card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card-label{
    font-size:17px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .card-sub{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    font-weight:400;
  }
  .arrow{
    color:var(--accent);
    font-size:18px;
    opacity:0.85;
  }
  footer{
    margin-top:28px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.02em;
  }
</style>
</head>
<body>
<main>
  <div class="header">
    <h1>Panel</h1>
    <span class="version">v1.0</span>
  </div>
  <div class="cards">
    <a class="card" href="gym_tracker.html" target="_blank" rel="noopener">
      <div>
        <div class="card-label">Gym Tracker</div>
        <div class="card-sub">Registro de sesiones</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="rutina.html" target="_blank" rel="noopener">
      <div>
        <div class="card-label">Rutina Manu</div>
        <div class="card-sub">Plan de entrenamiento</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="kpis.html" target="_blank" rel="noopener">
      <div>
        <div class="card-label">KPIs</div>
        <div class="card-sub">Indicadores del sistema</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
  <footer>cal · McManu85</footer>
</main>
</body>
</html>
